<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>休假申請單</title>
    <style>
        body {
            font-family: "微軟正黑體", sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            background-color: #fff;
            width: 800px;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header img {
            position: absolute;
            left: 20px;
            height: 60px; /* 您可依實際 logo 大小調整高度 */
        }
        .header-text h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
        }
        .header-text h2 {
            margin: 10px 0 0 0;
            font-size: 20px;
            letter-spacing: 5px;
        }
        .business-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .business-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .date-right {
            text-align: right;
            margin-bottom: 10px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #000;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            vertical-align: middle;
        }
        .text-center {
            text-align: center;
        }
        /* 讓輸入區域絕對水平垂直置中 */
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }
        input[type="text"], textarea {
            width: 90%;
            padding: 5px;
            font-size: 16px;
            border: 1px dashed #ccc;
            background-color: #fafafa;
            text-align: center;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
        }
        textarea {
            height: 120px;
            text-align: center; 
            line-height: 1.5;
        }
        /* 列印模式下的輸入框樣式 */
        .print-mode input[type="text"], .print-mode textarea {
            border: none;
            background-color: transparent;
        }
        /* 核取方塊靠左對齊 */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            padding-left: 10px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            margin-right: 5px;
        }
        .other-input {
            width: auto !important;
            border-bottom: 1px solid #000 !important;
            border-top: none !important;
            border-left: none !important;
            border-right: none !important;
            background: transparent !important;
            text-align: left !important;
            border-radius: 0;
            margin-left: 5px;
        }
        /* 底部簽名區等分四欄 */
        .signature-table th {
            width: 25%;
            font-weight: normal;
        }
        .signature-table td {
            height: 80px;
        }
        .signature-table input[type="text"] {
            height: 90%;
            font-size: 24px;
        }
        
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        @media print {
            body {
                background-color: #fff;
                padding: 0;
            }
            .form-container {
                box-shadow: none;
                width: 100%;
                padding: 0;
            }
            .controls {
                display: none;
            }
            input[type="text"], textarea {
                border: none;
                background-color: transparent;
            }
            .other-input {
                border-bottom: 1px solid #000 !important;
            }
        }
    </style>
</head>
<body>

<div class="form-container" id="formContainer">
    <div class="header">
        <img src="手舞足道.png" alt="手舞足道 Logo">
        <div class="header-text">
            <h1>手舞足道休閒餐旅事業集團</h1>
            <h2>員工長假申請單</h2>
        </div>
    </div>

    <div class="business-group">
        <span>事業群：</span>
        <label><input type="checkbox"> 休閒美體事業群</label>
        <label><input type="checkbox"> 餐飲事業群</label>
        <label><input type="checkbox"> 健身事業群</label>
        <label><input type="checkbox"> 總管理處</label>
    </div>

    <div class="date-right">
        填寫日期： <input type="text" style="width: 50px; text-align: center;" class="other-input"> 年 
        <input type="text" style="width: 30px; text-align: center;" class="other-input"> 月 
        <input type="text" style="width: 30px; text-align: center;" class="other-input"> 日
    </div>

    <table>
        <tr>
            <td class="text-center" width="12%">申請單位</td>
            <td width="21%">
                <div class="flex-center">
                    <input type="text">
                </div>
            </td>
            <td class="text-center" width="12%">職稱</td>
            <td width="21%">
                <div class="flex-center">
                    <input type="text">
                </div>
            </td>
            <td class="text-center" width="12%">員工姓名</td>
            <td width="22%">
                <div class="flex-center">
                    <input type="text">
                </div>
            </td>
        </tr>
        <tr>
            <td class="text-center">休假日期</td>
            <td colspan="3">
                <div class="flex-center">
                    <textarea style="height: 100px; width: 95%;" placeholder="請填寫休假起訖時間及共計天數"></textarea>
                </div>
            </td>
            <td class="text-center">假別</td>
            <td>
                <div class="checkbox-group">
                    <label><input type="checkbox"> 事假</label>
                    <label><input type="checkbox"> 病假/公傷病假</label>
                    <label><input type="checkbox"> 特休/補休</label>
                    <label><input type="checkbox"> 婚假</label>
                    <label><input type="checkbox"> 產假</label>
                    <label><input type="checkbox"> 喪假</label>
                    <label><input type="checkbox"> 其他<input type="text" class="other-input" style="width: 80px !important;"></label>
                </div>
            </td>
        </tr>
        <tr>
            <td class="text-center">休假事項<br>說明</td>
            <td colspan="5">
                <div class="flex-center">
                    <textarea></textarea>
                </div>
            </td>
        </tr>
        <tr>
            <td class="text-center">檢附證明文<br>件</td>
            <td colspan="5">
                <div class="checkbox-group">
                    <label><input type="checkbox"> 醫師診斷證明</label>
                    <label><input type="checkbox"> 已完成結婚登記之戶籍謄本</label>
                    <label><input type="checkbox"> 新生兒出生證明</label>
                    <label><input type="checkbox"> 訃文影本</label>
                    <label><input type="checkbox"> 護照、簽證影本或旅行社證明</label>
                    <label><input type="checkbox"> 其他<input type="text" class="other-input" style="width: 200px !important;"></label>
                </div>
            </td>
        </tr>
        <tr>
            <td class="text-center">審核結果</td>
            <td colspan="5">
                <div class="flex-center" style="gap: 30px;">
                    <label><input type="checkbox"> 通過</label>
                    <label><input type="checkbox"> 不予通過</label>
                </div>
            </td>
        </tr>
    </table>

    <table class="signature-table" style="border-top: none;">
        <tr>
            <th class="text-center">店長</th>
            <th class="text-center">總監</th>
            <th class="text-center">副處長</th>
            <th class="text-center">處長</th>
        </tr>
        <tr>
            <td>
                <div class="flex-center">
                    <input type="text">
                </div>
            </td>
            <td>
                <div class="flex-center">
                    <input type="text">
                </div>
            </td>
            <td>
                <div class="flex-center">
                    <input type="text">
                </div>
            </td>
            <td>
                <div class="flex-center">
                    <input type="text">
                </div>
            </td>
        </tr>
    </table>
    
    <div style="text-align: right; margin-top: 10px; font-size: 12px;">
        HR-2022-11-16
    </div>
</div>

<div class="controls">
    <button class="btn" onclick="togglePrintMode()">切換列印/截圖模式</button>
</div>

<script>
    function togglePrintMode() {
        document.getElementById('formContainer').classList.toggle('print-mode');
    }
</script>

</body>
</html>
