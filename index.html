<!DOCTYPE html>
<html lang="zh-TW"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手舞足道休閒餐旅事業集團 - 員工長假申請單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "MingLiU", "PMingLiU", "Apple LiSung", serif;
            background-color: #f3f4f6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid black;
            background-color: white;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            word-wrap: break-word;
        }

        .input-centered {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            min-height: 40px; /* 確保單行輸入框有基本高度 */
            outline: none;
            cursor: text;
            white-space: pre-wrap;
            box-sizing: border-box;
        }

        .input-left {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            text-align: left;
            width: 100%;
            height: 100%;
            min-height: 40px;
            padding: 8px;
            outline: none;
            cursor: text;
            white-space: pre-wrap;
            box-sizing: border-box;
        }

        .input-large {
            min-height: 120px; /* 針對多行大欄位的高度 */
        }

        .input-signature {
            min-height: 80px; /* 針對簽名欄位的高度 */
            font-size: 1.25rem;
            font-weight: bold;
        }

        /* 編輯模式下的視覺提示 (淺藍底與虛線) */
        body:not(.print-mode) .editable-area {
            background-color: #f8fafc;
        }
        body:not(.print-mode) .editable-area:hover,
        body:not(.print-mode) .editable-area:focus {
            background-color: #eff6ff;
        }
        body:not(.print-mode) .editable-area:empty:before {
            content: "（點此輸入）";
            color: #cbd5e1;
            font-size: 0.9em;
        }

        .checkbox-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            width: 100%;
        }
        .checkbox-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            text-align: left;
            width: 100%;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid black;
            position: relative;
            cursor: pointer;
            background-color: white;
            flex-shrink: 0;
            margin-right: 6px;
        }
        input[type="checkbox"]:checked::after {
            content: "✔";
            position: absolute;
            top: -4px;
            left: 1px;
            font-size: 16px;
            color: black;
            font-weight: bold;
        }

        .inline-text-input {
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
        }
        body:not(.print-mode) .inline-text-input {
            border-bottom: 1px solid black;
        }

        .print-mode {
            background-color: white !important;
        }
        .print-mode .no-print {
            display: none !important;
        }
        .print-mode .form-container {
            box-shadow: none !important;
            margin: 0 !important;
            padding: 0 !important;
            max-width: 100% !important;
        }
        .print-mode .editable-area {
            background-color: transparent !important;
            border-bottom: none !important;
        }
    </style>

<body class="p-4 md:p-8 print-mode">

    <div class="max-w-4xl mx-auto bg-white p-8 shadow-lg form-container transition-all duration-300">
        
        <div class="flex justify-end mb-6 no-print">
            <button onclick="enablePrintMode()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow-md flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path>
                </svg>
                <span>進入截圖/列印模式</span>
            </button>
        </div>

        <div class="text-center mb-6 relative flex justify-center items-center">
            <img src="手舞足道.png" alt="Logo" class="absolute left-0 h-16 object-contain hidden md:block" onerror="this.style.display='none'">
            <div>
                <h1 class="text-3xl font-bold tracking-widest mb-2">手舞足道休閒餐旅事業集團</h1>
                <h2 class="text-xl font-bold tracking-widest">員工長假申請單</h2>
            </div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-2 text-sm md:text-base">
            <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-2 md:mb-0">
                <span class="font-bold">事業群：</span>
                <label class="flex items-center cursor-pointer hover:bg-gray-100 p-1"><input type="checkbox">休閒美體事業群</label>
                <label class="flex items-center cursor-pointer hover:bg-gray-100 p-1"><input type="checkbox">餐飲事業群</label>
                <label class="flex items-center cursor-pointer hover:bg-gray-100 p-1"><input type="checkbox">健身事業群</label>
                <label class="flex items-center cursor-pointer hover:bg-gray-100 p-1"><input type="checkbox">總管理處</label>
            </div>
            
            <div class="flex items-center whitespace-nowrap">
                <span>填寫日期：</span>
                <input type="text" id="fill-year" class="inline-text-input text-center w-12 mx-1 editable-area" value="">
                <span>年</span>
                <input type="text" id="fill-month" class="inline-text-input text-center w-8 mx-1 editable-area" value="">
                <span>月</span>
                <input type="text" id="fill-day" class="inline-text-input text-center w-8 mx-1 editable-area" value="">
                <span>日</span>
            </div>
        </div>

        <table>
            <colgroup>
                <col style="width: 8.33%;"><col style="width: 8.33%;"><col style="width: 8.33%;"><col style="width: 8.33%;">
                <col style="width: 8.33%;"><col style="width: 8.33%;"><col style="width: 8.33%;"><col style="width: 8.33%;">
                <col style="width: 8.33%;"><col style="width: 8.33%;"><col style="width: 8.33%;"><col style="width: 8.33%;">
            </colgroup>
            
            <tbody>
                <!-- 基本資料列 -->
                <tr>
                    <td colspan="2" class="text-center font-bold">申請單位</td>
                    <td colspan="2" class="p-0"><div contenteditable="true" class="input-centered editable-area">中清店</div></td>
                    <td colspan="2" class="text-center font-bold">職稱</td>
                    <td colspan="2" class="p-0"><div contenteditable="true" class="input-centered editable-area"></div></td>
                    <td colspan="2" class="text-center font-bold">員工姓名</td>
                    <td colspan="2" class="p-0"><div contenteditable="true" class="input-centered editable-area"></div></td>
                </tr>

                <!-- 休假日期與假別 -->
                <tr>
                    <td colspan="2" class="text-center font-bold">休假日期</td>
                    <td colspan="4" class="p-4 align-top">
                        <div class="flex flex-col space-y-3 text-left">
                            <div class="flex items-center">
                                <span class="mr-2">自</span>
                                <input type="text" class="inline-text-input text-center w-10 mx-1 editable-area"><span>年</span>
                                <input type="text" class="inline-text-input text-center w-8 mx-1 editable-area"><span>月</span>
                                <input type="text" class="inline-text-input text-center w-8 mx-1 editable-area"><span>日</span>
                                <input type="text" class="inline-text-input text-center w-8 mx-1 editable-area"><span>時</span>
                            </div>
                            <div class="flex items-center">
                                <span class="mr-2">至</span>
                                <input type="text" class="inline-text-input text-center w-10 mx-1 editable-area"><span>年</span>
                                <input type="text" class="inline-text-input text-center w-8 mx-1 editable-area"><span>月</span>
                                <input type="text" class="inline-text-input text-center w-8 mx-1 editable-area"><span>日</span>
                                <input type="text" class="inline-text-input text-center w-8 mx-1 editable-area"><span>時</span>
                            </div>
                            <div class="flex items-center mt-4">
                                <span class="mr-2">共計 (</span>
                                <input type="text" class="inline-text-input text-center w-12 mx-1 editable-area"><span>) 天</span>
                            </div>
                        </div>
                    </td>
                    <td colspan="2" class="text-center font-bold">假別</td>
                    <!-- 假別核取方塊，嚴格靠左 -->
                    <td colspan="4" class="p-3 align-top">
                        <div class="checkbox-container space-y-1">
                            <label class="cursor-pointer hover:bg-gray-50 w-full p-1 flex items-center"><input type="checkbox">事假</label>
                            <label class="cursor-pointer hover:bg-gray-50 w-full p-1 flex items-center"><input type="checkbox">病假/公傷病假</label>
                            <label class="cursor-pointer hover:bg-gray-50 w-full p-1 flex items-center"><input type="checkbox">特休/補休</label>
                            <label class="cursor-pointer hover:bg-gray-50 w-full p-1 flex items-center"><input type="checkbox">婚假</label>
                            <label class="cursor-pointer hover:bg-gray-50 w-full p-1 flex items-center"><input type="checkbox">產假</label>
                            <label class="cursor-pointer hover:bg-gray-50 w-full p-1 flex items-center"><input type="checkbox">喪假</label>
                            <div class="flex items-center w-full mt-1 p-1">
                                <input type="checkbox">
                                <span class="whitespace-nowrap mr-2">其他</span>
                                <input type="text" class="inline-text-input flex-grow editable-area">
                            </div>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="text-center font-bold">休假事項<br>說明</td>
                    <td colspan="10" class="p-0">
                        <div contenteditable="true" class="input-left input-large editable-area"></div>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="text-center font-bold">檢附證明文<br>件</td>
                    <td colspan="10" class="p-3 align-top">
                        <div class="checkbox-container space-y-1 pl-2">
                            <label class="cursor-pointer hover:bg-gray-50 p-1 w-full flex items-center"><input type="checkbox">醫師診斷證明</label>
                            <label class="cursor-pointer hover:bg-gray-50 p-1 w-full flex items-center"><input type="checkbox">已完成結婚登記之戶籍謄本</label>
                            <label class="cursor-pointer hover:bg-gray-50 p-1 w-full flex items-center"><input type="checkbox">新生兒出生證明</label>
                            <label class="cursor-pointer hover:bg-gray-50 p-1 w-full flex items-center"><input type="checkbox">訃文影本</label>
                            <label class="cursor-pointer hover:bg-gray-50 p-1 w-full flex items-center"><input type="checkbox">護照、簽證影本或旅行社證明</label>
                            <div class="flex items-center w-full sm:w-1/2 mt-1 p-1">
                                <input type="checkbox">
                                <span class="whitespace-nowrap mr-2">其他</span>
                                <input type="text" class="inline-text-input flex-grow editable-area">
                            </div>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="text-center font-bold py-4">審核結果</td>
                    <td colspan="10" class="py-4 px-6">
                        <div class="checkbox-row space-x-12">
                            <label class="cursor-pointer hover:bg-gray-50 p-1 flex items-center"><input type="checkbox">通過</label>
                            <label class="cursor-pointer hover:bg-gray-50 p-1 flex items-center"><input type="checkbox">不予通過</label>
                        </div>
                    </td>
                </tr>

                <!-- 簽名區 - 職稱列 -->
                <tr class="text-center font-bold bg-gray-50 print:bg-transparent">
                    <td colspan="3" class="py-2">店長</td>
                    <td colspan="3" class="py-2">總監</td>
                    <td colspan="3" class="py-2">副處長</td>
                    <td colspan="3" class="py-2">處長</td>
                </tr>
                
                <!-- 簽名區 - 輸入列 (獨立輸入欄位，垂直置中) -->
                <tr>
                    <td colspan="3" class="p-0">
                        <div contenteditable="true" class="input-centered input-signature editable-area">賴信吉</div>
                    </td>
                    <td colspan="3" class="p-0">
                        <div contenteditable="true" class="input-centered input-signature editable-area"></div>
                    </td>
                    <td colspan="3" class="p-0">
                        <div contenteditable="true" class="input-centered input-signature editable-area"></div>
                    </td>

        <div class="text-right text-sm mt-3 font-mono text-gray-700">

        </div>

    </div>

    <script>
        function enablePrintMode() {
            document.body.classList.add('print-mode');
            
            const notice = document.createElement('div');
            notice.id = 'print-notice';
            notice.style.position = 'fixed';
            notice.style.top = '10px';
            notice.style.left = '50%';
            notice.style.transform = 'translateX(-50%)';
            notice.style.backgroundColor = 'rgba(0,0,0,0.8)';
            notice.style.color = 'white';
            notice.style.padding = '10px 20px';
            notice.style.borderRadius = '20px';
            notice.style.zIndex = '9999';
            notice.style.fontSize = '14px';
            notice.innerHTML = '已進入截圖/列印模式。按 <kbd>ESC</kbd> 鍵或雙擊畫面任意處恢復編輯。';
            
            document.body.appendChild(notice);

            const exitPrintMode = (e) => {
                if (e.type === 'dblclick' || (e.type === 'keydown' && e.key === 'Escape')) {
                    document.body.classList.remove('print-mode');
                    const noticeEl = document.getElementById('print-notice');
                    if (noticeEl) noticeEl.remove();
                    
                    document.removeEventListener('dblclick', exitPrintMode);
                    document.removeEventListener('keydown', exitPrintMode);
                }
            };

            document.addEventListener('dblclick', exitPrintMode);
            document.addEventListener('keydown', exitPrintMode);
        }

        // 自動載入當日日期 (民國年)
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            document.getElementById('fill-year').value = today.getFullYear() - 1911;
            document.getElementById('fill-month').value = today.getMonth() + 1;
            document.getElementById('fill-day').value = today.getDate();
        });
    </script>
