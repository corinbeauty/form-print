<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手舞足道員工長假申請單</title>
    <style>
        /* 基本重置與字型設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "微軟正黑體", "Microsoft JhengHei", sans-serif;
            background-color: #525659; /* 模擬 PDF 或圖片瀏覽器的深色背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* A4 紙張設定 (210mm x 297mm) */
        .a4-paper {
            background-color: #fff;
            width: 210mm;
            height: 297mm;
            padding: 15mm; /* 留出版面邊界 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 防止浮水印超出邊界 */
        }

        /* 浮水印設定 */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%; /* 浮水印大小 */
            opacity: 0.05; /* 透明度設定 (已調淡) */
            pointer-events: none; /* 確保不會阻擋滑鼠點擊輸入框 */
            z-index: 0;
        }

        /* 表頭區域 (Logo + 標題) */
        .header {
            position: relative;
            text-align: center;
            margin-bottom: 5px;
            z-index: 1;
        }
        .header img {
            position: absolute;
            left: 0;
            top: -10px;
            height: 60px; /* Logo 尺寸 */
        }
        .header h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .header h2 {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        /* 單位與日期選擇區塊 */
        .info-row {
            display: flex;
            flex-direction: column; /* 改為垂直排列，讓日期掉到下方 */
            margin-bottom: 5px;
            font-size: 15px;
            font-weight: bold;
            z-index: 1;
        }
        .business-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .business-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: normal;
        }
        .date-input {
            display: flex;
            align-items: baseline;
            align-self: flex-end; /* 讓填寫日期靠右對齊 */
            margin-top: 5px; /* 與上方事業群保持一點間距 */
        }
        
        /* 通用輸入框與核取方塊樣式 */
        input[type="text"], textarea {
            font-family: inherit;
            font-size: 16px;
            border: none; /* 預設隱藏邊框，像實體紙張 */
            background-color: rgba(240, 248, 255, 0.3); /* 微微的底色提示可輸入 */
            outline: none;
        }
        input[type="text"]:focus, textarea:focus {
            background-color: rgba(230, 240, 255, 0.8);
            border-bottom: 1px dashed #333; /* 點擊時顯示底線 */
        }
        
        /* 特殊樣式：底部有底線的輸入框 */
        .input-underline {
            border-bottom: 1px solid #000 !important;
            border-radius: 0;
            background-color: transparent !important;
            text-align: center;
        }
        .input-underline:focus {
             border-bottom: 2px solid #000 !important;
        }

        input[type="checkbox"], input[type="radio"] {
            width: 14px;
            height: 14px;
            margin-right: 3px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            border: 1px solid #000;
            position: relative;
            border-radius: 0; /* 讓單選框保持正方形 */
        }
        input[type="checkbox"]:checked::after, input[type="radio"]:checked::after {
            content: "✔";
            position: absolute;
            top: -4px;
            left: 1px;
            font-size: 14px;
            color: black;
            font-weight: bold;
        }

        /* 表格主體 */
        table {
            width: 100%;
            flex-grow: 1; /* 表格自動填滿剩餘高度 */
            border-collapse: collapse;
            border: 2px solid #000;
            table-layout: fixed;
            z-index: 1;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            vertical-align: middle;
            font-size: 16px;
        }
        .text-center { text-align: center; font-weight: bold; }
        
        /* 表格內部佈局工具 */
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }
        .flex-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            height: 100%;
            padding-left: 5px;
        }

        /* 針對特定欄位的微調 */
        /* 第一列：基本資料 */
        .basic-info-row { height: 6%; }
        .basic-info-input { width: 100%; height: 100%; text-align: center; font-size: 18px;}

        /* 第二列：日期與假別 */
        .date-type-row { height: 20%; }
        .date-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            padding-left: 10px;
            font-size: 16px;
        }
        .date-line {
            display: flex;
            align-items: baseline;
        }
        
        .leave-type-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .leave-type-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        /* 第三列：說明 */
        .desc-row { height: 35%; } /* 拉高說明區塊 */
        .desc-textarea {
            width: 100%;
            height: 100%;
            resize: none;
            padding: 15px;
            font-size: 20px;
            line-height: 1.5;
            background-color: transparent;
            text-align: left;
            vertical-align: top;
            box-sizing: border-box; /* 確保 padding 運作，緊貼左上 */
        }

        /* 第四列：證明文件 */
        .doc-row { height: 20%; }
        .doc-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .doc-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        /* 第五列：審核結果 */
        .result-row { height: 7%; }
        .result-group {
            display: flex;
            justify-content: center;
            gap: 50px;
            font-weight: bold;
            font-size: 18px;
        }

        /* 第六列：簽名區 */
        .sig-title-row { height: 4%; }
        .sig-title-row th { width: 25%; }
        .sig-input-row { height: 8%; }
        .sig-input-row td { padding: 0; }
        .sig-input { width: 100%; height: 100%; text-align: center; font-size: 72px; font-weight: bold;}

        /* 右下角編號 */
        .form-id {
            text-align: right;
            font-size: 12px;
            font-family: Arial, sans-serif;
            margin-top: 5px;
            z-index: 1;
        }

        /* 隱藏/截圖模式按鈕 */
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .controls button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        .controls button:hover { background-color: #0056b3; }

        /* 列印/截圖模式專用 CSS */
        @media print, (max-width: 0) /* 後者為強制觸發用，實務靠 class 切換 */ {
            body { background-color: white; padding: 0; display: block; }
            .a4-paper { box-shadow: none; padding: 0; margin: 0; }
            .controls { display: none; }
            input[type="text"], textarea { background-color: transparent !important; border: none !important;}
            .input-underline { border-bottom: 1px solid #000 !important; }
        }
        .print-mode {
             background-color: white; padding: 0;
        }
        .print-mode .a4-paper { box-shadow: none; margin: 0 auto;}
        .print-mode input[type="text"], .print-mode textarea { background-color: transparent !important; }
        .print-mode .input-underline:not(:focus) { border-bottom: 1px solid #000 !important; }

    </style>
</head>
<body>

    <div class="a4-paper" id="paper-container">
        
        <!-- 背景浮水印 -->
        <img src="手舞足道.png" alt="watermark" class="watermark" onerror="this.style.display='none'">

        <!-- 表頭 -->
        <div class="header">
            <img src="手舞足道.png" alt="Logo" onerror="this.style.display='none'">
            <h1>手舞足道休閒餐旅事業集團</h1>
            <h2>員工長假申請單</h2>
        </div>

        <!-- 單位與日期 -->
        <div class="info-row">
            <div class="business-group">
                <span>事業群：</span>
                <label><input type="radio" name="bg"> 休閒美體事業群</label>
                <label><input type="radio" name="bg"> 餐飲事業群</label>
                <label><input type="radio" name="bg"> 健身事業群</label>
                <label><input type="radio" name="bg"> 總管理處</label>
            </div>
            
            <div class="date-input">
                <span>填寫日期：</span>
                <input type="text" id="fill-year" class="input-underline" style="width: 40px;"> 年
                <input type="text" id="fill-month" class="input-underline" style="width: 30px;"> 月
                <input type="text" id="fill-day" class="input-underline" style="width: 30px;"> 日
            </div>
        </div>

        <!-- 表格主體 -->
        <table>
            <colgroup>
                <col style="width: 12%;">
                <col style="width: 21.33%;">
                <col style="width: 12%;">
                <col style="width: 21.33%;">
                <col style="width: 12%;">
                <col style="width: 21.34%;">
            </colgroup>
            <tbody>
                <!-- 1. 基本資料 -->
                <tr class="basic-info-row">
                    <td class="text-center">申請單位</td>
                    <td style="padding:0;"><input type="text" class="basic-info-input"></td>
                    <td class="text-center">職稱</td>
                    <td style="padding:0;"><input type="text" class="basic-info-input"></td>
                    <td class="text-center">員工姓名</td>
                    <td style="padding:0;"><input type="text" class="basic-info-input"></td>
                </tr>

                <!-- 2. 日期與假別 -->
                <tr class="date-type-row">
                    <td class="text-center">請假日期</td>
                    <td colspan="3">
                        <div class="date-section">
                            <div class="date-line">
                                <span style="margin-right: 5px;">自</span>
                                <input type="text" class="input-underline" style="width: 40px; margin: 0 5px;"> 年
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 月
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 日
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 時
                            </div>
                            <div class="date-line">
                                <span style="margin-right: 5px;">至</span>
                                <input type="text" class="input-underline" style="width: 40px; margin: 0 5px;"> 年
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 月
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 日
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 時
                            </div>
                            <div class="date-line" style="margin-top: 15px; margin-left: 20px;">
                                <span>共計 (</span>
                                <input type="text" style="width: 60px; text-align: center; border-bottom: 1px dashed #999;">
                                <span>) 天</span>
                            </div>
                        </div>
                    </td>
                    <td class="text-center">假別</td>
                    <td>
                        <div class="flex-left leave-type-group">
                            <label><input type="checkbox"> 事假</label>
                            <label><input type="checkbox"> 病假/公傷病假</label>
                            <label><input type="checkbox"> 特休/補休</label>
                            <label><input type="checkbox"> 婚假</label>
                            <label><input type="checkbox"> 產假</label>
                            <label><input type="checkbox"> 喪假</label>
                            <div style="display: flex; align-items: baseline;">
                                <label style="margin-right: 5px;"><input type="checkbox"> 其他</label>
                                <input type="text" class="input-underline" style="width: 80px;">
                            </div>
                        </div>
                    </td>
                </tr>

                <!-- 3. 說明 -->
                <tr class="desc-row">
                    <td class="text-center">請假事項<br>說明</td>
                    <td colspan="5" style="padding: 0;">
                        <textarea class="desc-textarea"></textarea>
                    </td>
                </tr>

                <!-- 4. 證明文件 -->
                <tr class="doc-row">
                    <td class="text-center">檢附證明<br>文件</td>
                    <td colspan="5">
                        <div class="flex-left doc-group">
                            <label><input type="checkbox"> 醫師診斷證明</label>
                            <label><input type="checkbox"> 已完成結婚登記之戶籍謄本</label>
                            <label><input type="checkbox"> 新生兒出生證明</label>
                            <label><input type="checkbox"> 訃文影本</label>
                            <label><input type="checkbox"> 護照、簽證影本或旅行社證明</label>
                            <div style="display: flex; align-items: baseline; width: 100%;">
                                <label style="margin-right: 5px;"><input type="checkbox"> 其他</label>
                                <input type="text" class="input-underline" style="flex-grow: 1; max-width: 300px; text-align: left; padding-left: 5px;">
                            </div>
                        </div>
                    </td>
                </tr>

                <!-- 5. 審核結果 -->
                <tr class="result-row">
                    <td class="text-center">審核結果</td>
                    <td colspan="5">
                        <div class="result-group">
                            <label style="cursor: pointer; display: flex; align-items: center;"><input type="checkbox"> 通過</label>
                            <label style="cursor: pointer; display: flex; align-items: center;"><input type="checkbox"> 不予通過</label>
                        </div>
                    </td>
                </tr>

                <!-- 6. 簽名區 -->
                <tr>
                    <td colspan="6" style="padding: 0; height: 12%;">
                        <div style="display: flex; width: 100%; height: 100%;">
                            <div style="flex: 1; border-right: 1px solid #000; display: flex; flex-direction: column;">
                                <div style="height: 30%; border-bottom: 1px solid #000; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px;">店長</div>
                                <div style="height: 70%;"><input type="text" class="sig-input"></div>
                            </div>
                            <div style="flex: 1; border-right: 1px solid #000; display: flex; flex-direction: column;">
                                <div style="height: 30%; border-bottom: 1px solid #000; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px;">總監</div>
                                <div style="height: 70%;"><input type="text" class="sig-input"></div>
                            </div>
                            <div style="flex: 1; border-right: 1px solid #000; display: flex; flex-direction: column;">
                                <div style="height: 30%; border-bottom: 1px solid #000; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px;">副處長</div>
                                <div style="height: 70%;"><input type="text" class="sig-input"></div>
                            </div>
                            <div style="flex: 1; display: flex; flex-direction: column;">
                                <div style="height: 30%; border-bottom: 1px solid #000; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px;">處長</div>
                                <div style="height: 70%;"><input type="text" class="sig-input"></div>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- 右下角編號 -->
        <div class="form-id">HR-2022-11-16</div>
    </div>

    <!-- 控制按鈕 -->
    <div class="controls no-print">
        <button onclick="togglePrintMode()">
            🖼️ 切換截圖/列印模式
        </button>
    </div>

    <script>
        // 自動載入今日日期 (轉換為民國年)
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const twYear = today.getFullYear() - 1911;
            
            document.getElementById('fill-year').value = twYear;
            document.getElementById('fill-month').value = today.getMonth() + 1;
            document.getElementById('fill-day').value = today.getDate();
        });

        // 截圖/列印模式切換 (隱藏輸入框底色)
        let isPrintMode = false;
        function togglePrintMode() {
            isPrintMode = !isPrintMode;
            if (isPrintMode) {
                document.body.classList.add('print-mode');
                // 提示訊息
                let notice = document.createElement('div');
                notice.id = 'mode-notice';
                notice.style.cssText = 'position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 8px; z-index: 9999; font-size: 16px; cursor: pointer; text-align: center;';
                notice.innerHTML = '已進入截圖模式<br><span style="font-size:12px; color:#ccc;">(點擊此框即可還原編輯模式)</span>';
                notice.onclick = togglePrintMode;
                document.body.appendChild(notice);
            } else {
                document.body.classList.remove('print-mode');
                const notice = document.getElementById('mode-notice');
                if (notice) notice.remove();
            }
        }
    </script>
</body>
</html>
