<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手舞足道員工長假申請單</title>
    <style>
        /* 基本重置與字型設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "微軟正黑體", "Microsoft JhengHei", sans-serif;
            background-color: #525659;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* A4 紙張設定 (210mm x 297mm) */
        .a4-paper {
            background-color: #fff;
            width: 210mm;
            height: 297mm;
            padding: 15mm;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 浮水印設定 */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            opacity: 0.05; /* 浮水印已調淡 */
            pointer-events: none;
            z-index: 0;
        }

        /* 表頭區域 */
        .header {
            position: relative;
            text-align: center;
            margin-bottom: 5px;
            z-index: 1;
        }
        .header img {
            position: absolute;
            left: 0;
            top: -10px;
            height: 60px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .header h2 {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        /* 單位與日期選擇區塊 */
        .info-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 5px;
            font-size: 15px;
            font-weight: bold;
            z-index: 1;
        }
        .business-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .business-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: normal;
        }
        .date-input {
            display: flex;
            align-items: baseline;
            align-self: flex-end;
            margin-top: 5px;
        }
        
        /* 通用輸入框與核取方塊樣式 */
        input[type="text"], textarea {
            font-family: inherit;
            font-size: 16px;
            border: none;
            background-color: rgba(240, 248, 255, 0.3);
            outline: none;
        }
        input[type="text"]:focus, textarea:focus {
            background-color: rgba(230, 240, 255, 0.8);
            border-bottom: 1px dashed #333;
        }
        
        .input-underline {
            border-bottom: 1px solid #000 !important;
            border-radius: 0;
            background-color: transparent !important;
            text-align: center;
        }
        .input-underline:focus {
             border-bottom: 2px solid #000 !important;
        }

        /* 讓 radio 保持方框外觀 (模擬複選框但功能為單選) */
        input[type="checkbox"], input[type="radio"] {
            width: 14px;
            height: 14px;
            margin-right: 3px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            border: 1px solid #000;
            position: relative;
            border-radius: 0;
        }
        input[type="checkbox"]:checked::after, input[type="radio"]:checked::after {
            content: "✔";
            position: absolute;
            top: -4px;
            left: 1px;
            font-size: 14px;
            color: black;
            font-weight: bold;
        }

        /* 表格主體 */
        table {
            width: 100%;
            /* Apply requested table properties */
            height: 100%;
            flex: 1 1 auto;
            min-height: 0;
            
            border-collapse: collapse;
            border: 2px solid #000;
            table-layout: fixed;
            z-index: 1;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            vertical-align: middle;
            font-size: 16px;
        }
        .text-center { text-align: center; font-weight: bold; }
        
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }
        .flex-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            height: 100%;
            padding-left: 5px;
        }

        .basic-info-row { height: 6%; }
        .basic-info-input { width: 100%; height: 100%; text-align: center; font-size: 18px;}

        .date-type-row { height: 18%; }
        .date-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            padding-left: 10px;
            font-size: 16px;
        }
        .date-line {
            display: flex;
            align-items: baseline;
        }
        
        .leave-type-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .leave-type-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        /* 根據要求將說明區高度壓縮為 6% */
        .desc-row { height: 6%; }
        .desc-textarea {
            width: 100%;
            height: 100%;
            display: block;
            resize: none;
            padding: 8px 10px;
            font-size: 16px;
            line-height: 1.5;
            background-color: transparent;
            text-align: left;
            box-sizing: border-box;
            border: none;
            outline: none;
        }

        .doc-row { height: 18%; }
        .doc-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .doc-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .result-row { height: 7%; }
        .result-group {
            display: flex;
            justify-content: center;
            gap: 50px;
            font-weight: bold;
            font-size: 18px;
        }

        /* 縮小簽名區至一半 */
        .signature-row { 
            height: 19%; 
            min-height: 120px;
        }
        /* 內部簽名框高度佔滿 */
        .sig-box-container {
            width: 100%;
            /* Apply requested container properties */
            height: 100%;
            min-height: 120px;
            display: flex;
        }
        .sig-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #000;
        }
        .sig-box:last-child {
            border-right: none;
        }
        .sig-title {
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #000;
            padding: 8px 0;
            background-color: rgba(0,0,0,0.03);
            /* 固定高度約42px */
            height: 42px;
            line-height: 26px; /* 調整行高以垂直置中文字 (42 - 8*2 padding = 26) */
        }
        .sig-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .sig-input { 
            width: 90%; 
            height: 90%; 
            text-align: center; 
            font-size: 36px;
            font-weight: bold;
            background-color: transparent;
            border: none;
        }
        .sig-input:focus {
            border-bottom: 1px dashed #333;
            outline: none;
        }

        .form-id {
            text-align: right;
            font-size: 12px;
            font-family: Arial, sans-serif;
            margin-top: 5px;
            z-index: 1;
        }

        @media print {
            body { background-color: white; padding: 0; display: block; }
            .a4-paper { box-shadow: none; padding: 0; margin: 0; }
            input[type="text"], textarea { background-color: transparent !important; border: none !important;}
            .input-underline { border-bottom: 1px solid #000 !important; }
            .sig-input:focus { border-bottom: none; }
        }

    </style>
</head>
<body>
    <div class="a4-paper" id="paper-container">
        
        <!-- 背景浮水印 -->
        <img src="手舞足道.png" alt="watermark" class="watermark" onerror="this.style.display='none'">

        <!-- 表頭 -->
        <div class="header">
            <img src="手舞足道.png" alt="Logo" onerror="this.style.display='none'">
            <h1>手舞足道休閒餐旅事業集團</h1>
            <h2>員工長假申請單</h2>
        </div>

        <!-- 單位與日期 -->
        <div class="info-row">
            <div class="business-group">
                <span>事業群：</span>
                <label><input type="radio" name="bg"> 休閒美體事業群</label>
                <label><input type="radio" name="bg"> 餐飲事業群</label>
                <label><input type="radio" name="bg"> 健身事業群</label>
                <label><input type="radio" name="bg"> 總管理處</label>
            </div>
            
            <div class="date-input">
                <span>填寫日期：</span>
                <input type="text" id="fill-year" class="input-underline" style="width: 40px;"> 年
                <input type="text" id="fill-month" class="input-underline" style="width: 30px;"> 月
                <input type="text" id="fill-day" class="input-underline" style="width: 30px;"> 日
            </div>
        </div>

        <!-- 表格主體 -->
        <table>
            <colgroup>
                <col style="width: 12%;">
                <col style="width: 21.33%;">
                <col style="width: 12%;">
                <col style="width: 21.33%;">
                <col style="width: 12%;">
                <col style="width: 21.34%;">
            </colgroup>
            <tbody>
                <!-- 1. 基本資料 -->
                <tr class="basic-info-row">
                    <td class="text-center">申請單位</td>
                    <td style="padding:0;"><input type="text" class="basic-info-input"></td>
                    <td class="text-center">職稱</td>
                    <td style="padding:0;"><input type="text" class="basic-info-input"></td>
                    <td class="text-center">員工姓名</td>
                    <td style="padding:0;"><input type="text" class="basic-info-input"></td>
                </tr>

                <!-- 2. 日期與假別 -->
                <tr class="date-type-row">
                    <td class="text-center">請假日期</td>
                    <td colspan="3">
                        <div class="date-section">
                            <div class="date-line">
                                <span style="margin-right: 5px;">自</span>
                                <input type="text" class="input-underline" style="width: 40px; margin: 0 5px;"> 年
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 月
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 日
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 時
                            </div>
                            <div class="date-line">
                                <span style="margin-right: 5px;">至</span>
                                <input type="text" class="input-underline" style="width: 40px; margin: 0 5px;"> 年
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 月
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 日
                                <input type="text" class="input-underline" style="width: 30px; margin: 0 5px;"> 時
                            </div>
                            <div class="date-line" style="margin-top: 15px; margin-left: 20px;">
                                <span>共計 (</span>
                                <input type="text" style="width: 60px; text-align: center; border-bottom: 1px dashed #999;">
                                <span>) 天</span>
                            </div>
                        </div>
                    </td>
                    <td class="text-center">假別</td>
                    <td>
                        <div class="flex-left leave-type-group">
                            <label><input type="checkbox"> 事假</label>
                            <label><input type="checkbox"> 病假/公傷病假</label>
                            <label><input type="checkbox"> 特休/補休</label>
                            <label><input type="checkbox"> 婚假</label>
                            <label><input type="checkbox"> 產假</label>
                            <label><input type="checkbox"> 喪假</label>
                            <div style="display: flex; align-items: baseline;">
                                <label style="margin-right: 5px;"><input type="checkbox"> 其他</label>
                                <input type="text" class="input-underline" style="width: 80px;">
                            </div>
                        </div>
                    </td>
                </tr>

                <!-- 3. 說明 (高度已大幅縮減至 6%) -->
                <tr class="desc-row">
                    <td class="text-center">請假事項<br>說明</td>
                    <td colspan="5" style="padding: 0; vertical-align: top; height: 100%;">
                        <textarea class="desc-textarea"></textarea>
                    </td>
                </tr>

                <!-- 4. 證明文件 -->
                <tr class="doc-row">
                    <td class="text-center">檢附證明<br>文件</td>
                    <td colspan="5">
                        <div class="flex-left doc-group">
                            <label><input type="checkbox"> 醫師診斷證明</label>
                            <label><input type="checkbox"> 已完成結婚登記之戶籍謄本</label>
                            <label><input type="checkbox"> 新生兒出生證明</label>
                            <label><input type="checkbox"> 訃文影本</label>
                            <label><input type="checkbox"> 護照、簽證影本或旅行社證明</label>
                            <div style="display: flex; align-items: baseline; width: 100%;">
                                <label style="margin-right: 5px;"><input type="checkbox"> 其他</label>
                                <input type="text" class="input-underline" style="flex-grow: 1; max-width: 300px; text-align: left; padding-left: 5px;">
                            </div>
                        </div>
                    </td>
                </tr>

                <!-- 5. 審核結果 -->
                <tr class="result-row">
                    <td class="text-center">審核結果</td>
                    <td colspan="5">
                        <div class="result-group">
                            <label style="cursor: pointer; display: flex; align-items: center;"><input type="checkbox"> 通過</label>
                            <label style="cursor: pointer; display: flex; align-items: center;"><input type="checkbox"> 不予通過</label>
                        </div>
                    </td>
                </tr>

                <!-- 6. 簽名區 (高度已放大並設定最小高度) -->
                <tr class="signature-row">
                    <td colspan="6" style="padding: 0; height: 100%;">
                        <div class="sig-box-container">
                            <div class="sig-box">
                                <div class="sig-title">店長</div>
                                <div class="sig-content"><input type="text" class="sig-input"></div>
                            </div>
                            <div class="sig-box">
                                <div class="sig-title">總監</div>
                                <div class="sig-content"><input type="text" class="sig-input"></div>
                            </div>
                            <div class="sig-box">
                                <div class="sig-title">副處長</div>
                                <div class="sig-content"><input type="text" class="sig-input"></div>
                            </div>
                            <div class="sig-box">
                                <div class="sig-title">處長</div>
                                <div class="sig-content"><input type="text" class="sig-input"></div>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- 右下角編號 -->
        <div class="form-id">HR-2022-11-16</div>
    </div>

    <script>
        // 自動載入今日日期 (轉換為民國年)
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const twYear = today.getFullYear() - 1911;
            
            document.getElementById('fill-year').value = twYear;
            document.getElementById('fill-month').value = today.getMonth() + 1;
            document.getElementById('fill-day').value = today.getDate();
        });
    </script>
</body>
</html>
